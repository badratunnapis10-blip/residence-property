<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Blog - My Skill Residence</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- ==== ANIMATE ON SCROLL CSS CDN ==== -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- header -->
    <header class="header">
      <!-- navbar -->
      <nav class="nav">
        <div class="logo">
          <a href="./index.html" style="text-decoration: none;">
            <h2>MySkill <br> <span id="black-title">Residence.</span></h2>
          </a>
        </div>

        <div class="nav_menu" id="nav_menu">
          <button class="close_btn" id="close_btn" aria-label="Tutup Menu">
            <i class="fa fa-arrow-right"></i>
          </button>

          <ul class="nav_menu_list">
            <li class="nav_menu_item">
              <a href="./index.html" class="nav_menu_link">Beranda</a>
            </li>
            <li class="nav_menu_item">
              <a href="./tipe_rumah.html" class="nav_menu_link">Tipe Rumah</a>
            </li>
            <li class="nav_menu_item">
              <a href="./tentang.html" class="nav_menu_link">Tentang Kami</a>
            </li>
            <li class="nav_menu_item">
              <a href="./kontak.html" class="nav_menu_link">Kontak</a>
            </li>
            <li class="nav_menu_item">
              <a href="./blog.html" class="nav_menu_link menu_active">Blog</a>
            </li>
          </ul>
        </div>

        <button class="toggle_btn" id="toggle_btn" aria-label="Buka Menu">
          <i class="fa fa-bars"></i>
        </button>

      </nav>
    </header>
    <!-- header -->

    <!-- container title -->
    <section class="wrapper-content detail_blog">
        <div class="container-fluid">
            <div class="row" id="content-title">
                <div class="col-md-12 text-center px-3">
                    <h2 id="title-blog" style="font-size: clamp(1.4rem, 2.5vw, 2.2rem);">Detail Artikel</h2>
                </div>
            </div>
        </div>
    </section>
    <!-- container title -->

    <!-- section content -->
    <div class="container pt-2 pb-5 mb-4 detail_blog">
        <div class="row">
            <div class="col-md-8 col-lg-9 mt-4 mb-4">
                <div class="card p-3 p-md-4 shadow-sm border-0" style="border-radius: 20px;">
                    <a href="./blog.html" class="text-decoration-none text-muted mb-3 d-inline-block">
                        <i class="fa fa-arrow-left me-1"></i> Kembali ke Semua Artikel
                    </a>
                    <img id="cardDetailImg" class="img-fluid rounded mb-3 w-100" style="max-height: 420px; object-fit: cover;" alt="Blog Header Image" />
                    <div class="blog-date d-flex text-muted mb-3 align-items-center">
                        <i class="fa fa-calendar me-2 text-primary"></i>
                        <span id="tgl-blog" class="fw-semibold">21 Maret 2024</span>
                    </div>
                    <iframe src="./content/blog-1.html" id="cardDetailBlog" class="w-100" style="border: none; min-height: 800px;"></iframe>
                </div>
            </div>
            <div class="col-md-4 col-lg-3 mt-4 mb-4">
                <div class="card p-3 shadow-sm border-0" style="border-radius: 16px;">
                    <div class="form-group mb-3">
                        <label class="fw-bold mb-2 text-dark"><i class="fa fa-search me-1"></i> Cari Artikel</label>
                        <input type="text" class="form-control" placeholder="Ketik lalu Enter..." autocomplete="off"
                            onkeydown="if(event.key==='Enter'){window.location.href='./blog.html?q='+encodeURIComponent(this.value.trim());}"/>
                    </div>
                    <div class="latest-post mt-3 mb-2">
                        <p class="text-latest-post text-dark fw-bold mb-2">ARTIKEL LAINNYA</p>
                    </div>
                    <div class="latest-blog-content" id="latestBlogContent">
                         <!-- Dynamically generated by script.js -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- section content -->

    <!-- Footer-->
    <footer class="footer">
        <div>Copyright &copy; E-Learning MySkill 2024. All rights reserved.</div>
    </footer>
    <!-- Footer -->

    <!-- ==== ANIMATE ON SCROLL JS CDN -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- ==== GSAP CDN ==== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.8.0/gsap.min.js"></script>

    <!-- ==== SCRIPT.JS ==== -->
    <script src="./js/script.js" defer></script>
</body>
</html>
